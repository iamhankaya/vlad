# /etc/ssh/sshd_config.d/50-vlad.conf — install.sh yalnız HARDEN_SSH=1 ile kurar (önce `sshd -t`).
# Yalnız anahtarla giriş, root yok, parola yok. Tailscale SSH kullanılacaksa burası yedek yoldur.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 20
