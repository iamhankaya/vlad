# medialog kapasite tetikleyicileri (haftalık rapor). Kaynak: D-medialog-062 madde 1 ve 4; eşikler rules.yaml ile aynı.
# Bu dosya spc reposunda (servers/medialog/capacity.yaml) yazılır; VLAD testleri için fixture kopyasıdır (provenance.json).
version: 1
server: medialog
source: D-medialog-062
warn_pct: 70
consecutive_weeks: 2
triggers:
  - id: ws-concurrent
    title: Eşzamanlı WebSocket bağlantısı
    metric: app.ws_connections
    measure: peak
    op: ">="
    threshold: 300
    unit: bağlantı
    source_item: D-medialog-062 madde 1
  - id: proc-cpu
    title: Uygulama konteyneri CPU (günlük ortalamanın zirvesi)
    metric: docker.container.cpu_pct
    labels: { name: medialog-app-1 }
    measure: daily_avg_peak
    op: ">"
    threshold: 60
    unit: "%"
    source_item: D-medialog-062 madde 4
  - id: proc-mem
    title: Uygulama konteyneri bellek (günlük ortalamanın zirvesi)
    metric: docker.container.mem_pct
    labels: { name: medialog-app-1 }
    measure: daily_avg_peak
    op: ">"
    threshold: 60
    unit: "%"
    source_item: D-medialog-062 madde 4
  - id: db-pool-waiting
    title: DB bağlantı havuzunda bekleyen
    metric: app.db_pool_waiting
    measure: peak
    op: ">="
    threshold: 1
    unit: bekleyen
    source_item: D-medialog-062 madde 4
  - id: http-p95
    title: HTTP istek p95 gecikmesi (zirve)
    metric: app.http_p95_ms
    measure: peak
    op: ">"
    threshold: 1000
    unit: ms
    source_item: D-medialog-062 madde 4
manual:
  - id: zero-downtime
    title: Sıfır kesinti ihtiyacı (ölçülemez; karar notu)
    source_item: D-medialog-062 madde 2
  - id: vm-loss-tolerance
    title: VM kaybı toleransı (ölçülemez; karar notu)
    source_item: D-medialog-062 madde 3
